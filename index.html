<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T Chen — Blog</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background-color: #f7f5f0;
    color: #2a2824;
    font-family: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
    line-height: 2;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::selection {
    background: rgba(90, 138, 181, 0.15);
    color: #1a3a5c;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    padding: 96px 24px 48px;
    background: linear-gradient(180deg, #eae7df 0%, #f0ede5 40%, #f7f5f0 100%);
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 48px;
    height: 1px;
    background: #d4cfc5;
  }

  .header h1 {
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: #1a3a5c;
    margin-bottom: 12px;
  }

  .header .tagline {
    font-family: 'Noto Serif SC', serif;
    font-size: 0.9rem;
    font-weight: 300;
    color: #b0a999;
    letter-spacing: 0.15em;
  }

  /* ── Content ── */
  .content {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  .section-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: #b0a999;
    letter-spacing: 0.15em;
    margin-bottom: 32px;
    padding-bottom: 12px;
    border-bottom: 1px solid #e8e5dd;
  }

  /* ── Work list ── */
  .work-list {
    list-style: none;
  }

  .work-item {
    padding: 24px 0;
    border-bottom: 1px solid #edeae3;
    transition: background 0.2s;
  }

  .work-item:last-child {
    border-bottom: none;
  }

  .work-item a {
    text-decoration: none;
    color: inherit;
    display: block;
  }

  .work-item a:hover {
    color: #1a3a5c;
  }

  .work-title {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .work-title::before {
    content: '';
    display: block;
    width: 4px;
    height: 16px;
    background: #1a3a5c;
    border-radius: 2px;
    opacity: 0.4;
    flex-shrink: 0;
  }

  .work-meta {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.78rem;
    font-weight: 300;
    color: #b0a999;
    letter-spacing: 0.05em;
    padding-left: 14px;
  }

  .work-excerpt {
    font-size: 0.9rem;
    font-weight: 300;
    color: #8a8578;
    margin-top: 8px;
    padding-left: 14px;
    line-height: 1.8;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 32px 0 64px;
    border-top: 1px solid #e5e1d8;
    margin-top: 64px;
  }

  .footer p {
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 0.78rem;
    font-weight: 300;
    color: #c5bfb3;
    letter-spacing: 0.06em;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    body { font-size: 16px; }
    .header { padding: 64px 20px 36px; }
    .header h1 { font-size: 1.3rem; }
    .content { padding: 40px 18px 56px; }
  }

  @media print {
    body { font-size: 12pt; line-height: 1.8; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>T Chen</h1>
  <div class="tagline">写一点东西</div>
</div>

<div class="content">

  <div class="section-title">作品</div>

  <ul class="work-list">
    <li class="work-item">
      <a href="fei-jing.html">
        <div class="work-title">废镜</div>
        <div class="work-meta">2026 · 四节 · 小说</div>
        <div class="work-excerpt">那块镜片我举起来，透过它看天花板。什么也看不清。</div>
      </a>
    </li>
    <li class="work-item">
      <a href="blue-moon.html">
        <div class="work-title">Blue Moon</div>
        <div class="work-meta">2026 · 七章 · 小说</div>
        <div class="work-excerpt">东京的雨，总是先落在铁轨上。</div>
      </a>
    </li>
  </ul>

  <div class="footer">
    <p>&copy; 2026 T Chen</p>
  </div>

</div>

</body>
</html>
